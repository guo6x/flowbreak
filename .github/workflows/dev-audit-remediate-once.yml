# TEMPORARY, BRANCH-LOCKED. Remove immediately after dependency lock regeneration.
name: Temporary development-dependency audit remediation
on:
  push:
    branches: [security/no-phone-dev-audit-20261012]
    paths: ['.github/workflows/dev-audit-remediate-once.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'guo6x/flowbreak' && github.ref == 'refs/heads/security/no-phone-dev-audit-20261012'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Regenerate lockfile with patched dev dependencies
        run: |
          set -euo pipefail
          # Root Vitest pin was aligned before resolve. Avoid npm Arborist
          # crash when an old optional peer graph meets newly published peers.
          # npm v10 Arborist's optional Vitest peer graph can crash (edgesOut).
          # Resolve the lockfile with a newer npm and a lock-only legacy-peer
          # pass, then demand STANDARD (non-legacy) npm ci/test/audit success.
          npm install -g npm@11.19.0 --no-fund
          npm --version
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm audit fix --legacy-peer-deps --no-fund --no-audit
          # Restore optional/peer packages omitted by legacy resolution; the
          # shipped repo must support ordinary strict npm ci without flags.
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Commit only npm manifests and remove no secrets
        working-directory: .
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | tee "$RUNNER_TEMP/changed-names.txt"
          test -s "$RUNNER_TEMP/changed-names.txt"
          test "$(grep -Evc '^app/package(-lock)?\.json$' "$RUNNER_TEMP/changed-names.txt" || true)" -eq 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/package.json app/package-lock.json
          git commit -m 'fix(devdeps): update audited build and test dependencies'
          git push origin HEAD:refs/heads/security/no-phone-dev-audit-20261012
