# TEMPORARY: read-only virtual Android device preflight; no production signing.
# Delete this workflow after evidence is reviewed.
name: Temporary emulator-only privacy and screenshot preflight
on:
  push:
    branches: [privacy/no-phone-network-audit-20261012]
    paths: ['.github/workflows/emulator-no-phone-preflight-once.yml']
permissions:
  contents: read
jobs:
  emulator:
    if: github.repository == 'guo6x/flowbreak' && github.ref == 'refs/heads/privacy/no-phone-network-audit-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT_SHA: ${{ github.sha }}
      VERSION_CODE: 1
      VERSION_NAME: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
      - name: Build clean debug APK from exact source
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node scripts/generate-build-provenance.mjs dist
          npx cap sync android
          cd android
          ./gradlew assembleDomesticDebug --stacktrace
      - name: Start disposable Android 35 emulator and capture first-run proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flowbreak-emulator-evidence"
          echo 'SDK emulator installation beginning'
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'emulator' 'system-images;android-35;default;x86_64'
          echo no | avdmanager create avd --force -n flowbreak_review -k 'system-images;android-35;default;x86_64'
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup emulator -avd flowbreak_review -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics >"$RUNNER_TEMP/flowbreak-emulator-evidence/emulator.log" 2>&1 < /dev/null &
          adb wait-for-device
          echo 'Waiting for emulator boot (up to 6m)'
          for i in $(seq 1 90); do
            value=$(adb shell getprop sys.boot_completed | tr -d '\r' || true)
            if [ "$value" = "1" ]; then break; fi
            sleep 4
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0 || true
          apk=$(find app/android/app/build/outputs/apk/domestic/debug -name '*.apk' | head -1)
          test -s "$apk"
          adb install "$apk"
          adb shell am start -n com.flowbreak.app.cn/com.flowbreak.app.MainActivity
          sleep 15
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | tee "$RUNNER_TEMP/flowbreak-emulator-evidence/foreground.txt"
          # No success unless the actual FlowBreak Activity is foreground.
          grep -F 'com.flowbreak.app.cn/' "$RUNNER_TEMP/flowbreak-emulator-evidence/foreground.txt"
          adb shell pidof com.flowbreak.app.cn > "$RUNNER_TEMP/flowbreak-emulator-evidence/pid.txt"
          test -s "$RUNNER_TEMP/flowbreak-emulator-evidence/pid.txt"
          adb shell screencap -p /sdcard/flowbreak-fresh.png
          adb pull /sdcard/flowbreak-fresh.png "$RUNNER_TEMP/flowbreak-emulator-evidence/flowbreak-fresh.png"
          adb shell dumpsys netstats detail > "$RUNNER_TEMP/flowbreak-emulator-evidence/netstats-after.txt" || true
          adb shell dumpsys package com.flowbreak.app.cn | grep -E 'userId=|versionCode=|versionName=' > "$RUNNER_TEMP/flowbreak-emulator-evidence/package-info.txt"
          test -s "$RUNNER_TEMP/flowbreak-emulator-evidence/package-info.txt"
          echo "EMULATOR_PRELIMINARY_BOOTSTRAP_CAPTURE=PASS"
          echo "NOT_PHYSICAL_REDMl_GATE_F=TRUE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flowbreak-virtual-android-privacy-preflight
          path: ${{ runner.temp }}/flowbreak-emulator-evidence/
          retention-days: 14
          if-no-files-found: warn
