name: Android

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VERSION_CODE: 1
      VERSION_NAME: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build and test (Debug)
        working-directory: app/android
        shell: bash
        run: |
          set +e
          ./gradlew testPlayDebugUnitTest testDomesticDebugUnitTest lintPlayDebug lintDomesticDebug assemblePlayDebug assembleDomesticDebug assemblePlayDebugAndroidTest --stacktrace 2>&1 | tee gradle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error::Gradle build/test failed (exit $code)"
            find app/build/test-results -name '*.xml' 2>/dev/null | while read f; do
              if grep -q '<failure' "$f" 2>/dev/null; then
                testname=$(basename "$f" .xml)
                grep -oP 'message="[^"]{0,400}' "$f" | head -3 | while IFS= read -r msg; do
                  echo "::error::[$testname] ${msg#message=}"
                done
              fi
            done
            grep -iE '(Caused by:|FAILURE:|> Task.*FAILED)' gradle.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "=== Last 80 lines of gradle output ==="
            tail -80 gradle.log
            exit $code
          fi
      - name: Build release artifacts (unsigned)
        working-directory: app/android
        shell: bash
        run: ./gradlew bundlePlayRelease assembleDomesticRelease --stacktrace
      - name: Verify Release outputs
        working-directory: app/android
        shell: bash
        run: |
          set -e

          play_aab=$(find app/build/outputs/bundle/playRelease -maxdepth 1 -name '*.aab')
          domestic_apk=$(find app/build/outputs/apk/domestic/release -maxdepth 1 -name '*.apk')

          echo "Play AAB:      $play_aab"
          echo "Domestic APK:  $domestic_apk"

          test "$(printf '%s\n' "$play_aab" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$domestic_apk" | sed '/^$/d' | wc -l)" -eq 1
          test -s "$play_aab"
          test -s "$domestic_apk"

          echo "AAB size: $(stat -c %s "$play_aab") bytes"
          echo "APK size: $(stat -c %s "$domestic_apk") bytes"
      - name: Verify R8 and ProGuard mapping files
        working-directory: app/android
        shell: bash
        run: |
          set -e

          for channel in playRelease domesticRelease; do
            mapping_dir="app/build/outputs/mapping/${channel}"
            if [ ! -d "$mapping_dir" ]; then
              echo "::error::R8 mapping directory missing for $channel"
              exit 1
            fi
            echo "$channel mapping: $(find "$mapping_dir" -name 'mapping.txt' | head -1)"
            test -s "$mapping_dir/mapping.txt"
          done

          echo "R8 ran successfully for both channels."
      - name: Check Room schema drift
        working-directory: app/android
        shell: bash
        run: |
          set -e

          schema_dir="app/schemas"

          git diff --exit-code -- "$schema_dir"

          untracked="$(git ls-files --others --exclude-standard -- "$schema_dir")"
          if [ -n "$untracked" ]; then
            echo "::error::Uncommitted Room schema files detected:"
            echo "$untracked"
            exit 1
          fi

          test -f "$schema_dir/com.flowbreak.app.FlowDatabase/1.json"
          test -f "$schema_dir/com.flowbreak.app.FlowDatabase/2.json"
          test -f "$schema_dir/com.flowbreak.app.FlowDatabase/3.json"
      - name: Verify channel manifests
        working-directory: app/android
        shell: bash
        run: |
          set -e
          play_manifest=$(find app/build/intermediates -path "*merged_manifests*playDebug*" -name AndroidManifest.xml | head -1)
          domestic_manifest=$(find app/build/intermediates -path "*merged_manifests*domesticDebug*" -name AndroidManifest.xml | head -1)
          echo "Play manifest:     $play_manifest"
          echo "Domestic manifest: $domestic_manifest"
          test -n "$play_manifest"
          test -n "$domestic_manifest"
          test -f "$play_manifest"
          test -f "$domestic_manifest"

          for manifest in "$play_manifest" "$domestic_manifest"; do
            echo "Checking $manifest"
            grep -q 'com.flowbreak.app.FlowForegroundService' "$manifest"
            grep -q 'android:foregroundServiceType="specialUse"' "$manifest"
            grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$manifest"
            grep -q 'android.permission.FOREGROUND_SERVICE"' "$manifest"
            grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
          done

          ! grep -q 'FlowAccessibilityService' "$play_manifest"
          grep -q 'com.flowbreak.app.FlowAccessibilityService' "$domestic_manifest"

          echo "All manifest checks passed."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$FLOWBREAK_KEYSTORE_PASSWORD"
          test -n "$FLOWBREAK_KEY_ALIAS"
          test -n "$FLOWBREAK_KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flowbreak.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWBREAK_KEYSTORE_BASE64 }}
          FLOWBREAK_KEYSTORE_PASSWORD: ${{ secrets.FLOWBREAK_KEYSTORE_PASSWORD }}
          FLOWBREAK_KEY_ALIAS: ${{ secrets.FLOWBREAK_KEY_ALIAS }}
          FLOWBREAK_KEY_PASSWORD: ${{ secrets.FLOWBREAK_KEY_PASSWORD }}
      - name: Build signed releases
        working-directory: app/android
        run: ./gradlew bundlePlayRelease assembleDomesticRelease --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
          FLOWBREAK_KEYSTORE_FILE: ${{ runner.temp }}/flowbreak.jks
          FLOWBREAK_KEYSTORE_PASSWORD: ${{ secrets.FLOWBREAK_KEYSTORE_PASSWORD }}
          FLOWBREAK_KEY_ALIAS: ${{ secrets.FLOWBREAK_KEY_ALIAS }}
          FLOWBREAK_KEY_PASSWORD: ${{ secrets.FLOWBREAK_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowbreak-release
          path: |
            app/android/app/build/outputs/bundle/playRelease/*.aab
            app/android/app/build/outputs/apk/domestic/release/*.apk
