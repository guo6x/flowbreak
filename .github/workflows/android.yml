name: Android

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew testPlayDebugUnitTest testDomesticDebugUnitTest lintPlayDebug lintDomesticDebug assemblePlayDebug assembleDomesticDebug assemblePlayDebugAndroidTest --stacktrace
        working-directory: app/android
      - name: Check Room schema drift
        working-directory: app/android
        shell: bash
        run: git diff --exit-code -- app/schemas
      - name: Verify channel manifests
        working-directory: app/android
        shell: bash
        run: |
          set -e
          play_manifest=$(find app/build/intermediates -path "*merged_manifests*playDebug*" -name AndroidManifest.xml | head -1)
          domestic_manifest=$(find app/build/intermediates -path "*merged_manifests*domesticDebug*" -name AndroidManifest.xml | head -1)
          echo "Play manifest:     $play_manifest"
          echo "Domestic manifest: $domestic_manifest"
          test -n "$play_manifest"
          test -n "$domestic_manifest"
          test -f "$play_manifest"
          test -f "$domestic_manifest"

          # --- Shared foreground-service assertions (both channels) ---
          for manifest in "$play_manifest" "$domestic_manifest"; do
            echo "Checking $manifest"
            grep -q 'com.flowbreak.app.FlowForegroundService' "$manifest"
            grep -q 'android:foregroundServiceType="specialUse"' "$manifest"
            grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$manifest"
            grep -q 'android.permission.FOREGROUND_SERVICE"' "$manifest"
            grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
          done

          # --- Channel-specific assertions ---
          # Play channel must NOT include the accessibility service.
          ! grep -q 'FlowAccessibilityService' "$play_manifest"
          # Domestic channel must include the accessibility service.
          grep -q 'com.flowbreak.app.FlowAccessibilityService' "$domestic_manifest"

          echo "All manifest checks passed."

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Run Room migration instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -netdelay none -netspeed full
          script: |
            cd app/android
            echo "Waiting for device to be ready..."
            adb wait-for-device
            echo "Boot completed:"; adb shell getprop sys.boot_completed || true
            echo "Connected devices:"; adb devices
            ./gradlew connectedPlayDebugAndroidTest --stacktrace || {
              code=$?
              echo "::error::connectedPlayDebugAndroidTest exit code $code"
              echo "--- androidTest result XML files ---"
              find app/build/outputs/androidTest-results -name '*.xml' -print 2>/dev/null || true
              report=$(find app/build/outputs/androidTest-results -name '*.xml' -print -quit 2>/dev/null)
              if [ -f "$report" ]; then
                echo "--- Failure messages ---"
                grep -o 'message="[^"]*"' "$report" | head -20 || true
                echo "--- Test report (first 120 lines) ---"
                head -120 "$report" || true
              else
                echo "::error::No XML test report found - likely emulator boot failure"
                echo "--- logcat tail ---"
                adb logcat -d -t 80 2>/dev/null || true
              fi
              exit $code
            }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$FLOWBREAK_KEYSTORE_PASSWORD"
          test -n "$FLOWBREAK_KEY_ALIAS"
          test -n "$FLOWBREAK_KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flowbreak.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWBREAK_KEYSTORE_BASE64 }}
          FLOWBREAK_KEYSTORE_PASSWORD: ${{ secrets.FLOWBREAK_KEYSTORE_PASSWORD }}
          FLOWBREAK_KEY_ALIAS: ${{ secrets.FLOWBREAK_KEY_ALIAS }}
          FLOWBREAK_KEY_PASSWORD: ${{ secrets.FLOWBREAK_KEY_PASSWORD }}
      - name: Build signed releases
        working-directory: app/android
        run: ./gradlew bundlePlayRelease assembleDomesticRelease --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
          FLOWBREAK_KEYSTORE_FILE: ${{ runner.temp }}/flowbreak.jks
          FLOWBREAK_KEYSTORE_PASSWORD: ${{ secrets.FLOWBREAK_KEYSTORE_PASSWORD }}
          FLOWBREAK_KEY_ALIAS: ${{ secrets.FLOWBREAK_KEY_ALIAS }}
          FLOWBREAK_KEY_PASSWORD: ${{ secrets.FLOWBREAK_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: flowbreak-release
          path: |
            app/android/app/build/outputs/bundle/playRelease/*.aab
            app/android/app/build/outputs/apk/domestic/release/*.apk
