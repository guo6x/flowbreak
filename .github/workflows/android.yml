name: Android

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VERSION_CODE: 1
      VERSION_NAME: ci-${{ github.sha }}
      # SOURCE_COMMIT_SHA = the commit this run actually checks out and builds.
      # - push to master / tag: equals github.sha
      # - pull_request: the PR head sha (checkout is pinned to it below);
      #   github.sha then remains the PR merge sha and is recorded as workflowSha only.
      SOURCE_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SOURCE_COMMIT_SHA }}
      - name: Verify source identity (pre-build)
        shell: bash
        run: |
          set -e
          actual_sha=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$actual_sha"
          echo "SOURCE_REF=$GITHUB_REF"
          echo "WORKFLOW_SHA=$GITHUB_SHA"
          test "$actual_sha" = "$SOURCE_COMMIT_SHA"
          dirty="$(git status --porcelain)"
          test -z "$dirty"
          echo "SOURCE_IDENTITY=PASS sourceGitSha=$actual_sha workflowSha=$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical
      - run: npm test
      - run: npm run test:provenance
      - run: npm run test:release
      - run: npm run build
      - name: Generate build provenance
        run: node scripts/generate-build-provenance.mjs dist
      - run: npx cap sync android
      - name: Verify web asset sync (dist -> Android assets)
        run: node scripts/verify-web-asset-sync.mjs dist android/app/src/main/assets/public
      - name: Build and test (Debug)
        working-directory: app/android
        shell: bash
        run: |
          set +e
          ./gradlew testPlayDebugUnitTest testDomesticDebugUnitTest lintPlayDebug lintDomesticDebug assemblePlayDebug assembleDomesticDebug assemblePlayDebugAndroidTest --stacktrace 2>&1 | tee gradle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error::Gradle build/test failed (exit $code)"
            find app/build/test-results -name '*.xml' 2>/dev/null | while read f; do
              if grep -q '<failure' "$f" 2>/dev/null; then
                testname=$(basename "$f" .xml)
                grep -oP 'message="[^"]{0,400}' "$f" | head -3 | while IFS= read -r msg; do
                  echo "::error::[$testname] ${msg#message=}"
                done
              fi
            done
            grep -iE '(Caused by:|FAILURE:|> Task.*FAILED)' gradle.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "=== Last 80 lines of gradle output ==="
            tail -80 gradle.log
            exit $code
          fi
      - name: Build release artifacts (unsigned)
        working-directory: app/android
        shell: bash
        run: ./gradlew bundlePlayRelease assembleDomesticRelease --stacktrace
      - name: Verify Release outputs
        working-directory: app/android
        shell: bash
        run: |
          set -e

          play_aab=$(find app/build/outputs/bundle/playRelease -maxdepth 1 -name '*.aab')
          domestic_apk=$(find app/build/outputs/apk/domestic/release -maxdepth 1 -name '*.apk')

          echo "Play AAB:      $play_aab"
          echo "Domestic APK:  $domestic_apk"

          test "$(printf '%s\n' "$play_aab" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$domestic_apk" | sed '/^$/d' | wc -l)" -eq 1
          test -s "$play_aab"
          test -s "$domestic_apk"

          echo "AAB size: $(stat -c %s "$play_aab") bytes"
          echo "APK size: $(stat -c %s "$domestic_apk") bytes"
      - name: Verify packaged provenance (APK/AAB)
        working-directory: app/android
        shell: bash
        run: |
          set -e

          play_aab=$(find app/build/outputs/bundle/playRelease -maxdepth 1 -name '*.aab')
          domestic_apk=$(find app/build/outputs/apk/domestic/release -maxdepth 1 -name '*.apk')

          # 1) build-provenance.json must be packaged inside the final binaries
          echo "== Domestic APK packaged web assets (provenance entries) =="
          unzip -l "$domestic_apk" | grep -F 'assets/public/build-provenance.json'
          apk_prov=$(unzip -p "$domestic_apk" assets/public/build-provenance.json)
          test -n "$apk_prov"
          apk_sha=$(printf '%s' "$apk_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceGitSha"])')
          apk_vc=$(printf '%s' "$apk_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')
          apk_vn=$(printf '%s' "$apk_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionName"])')
          test "$apk_sha" = "$SOURCE_COMMIT_SHA"
          test "$apk_vc" = "$VERSION_CODE"
          test "$apk_vn" = "$VERSION_NAME"
          echo "DOMESTIC_APK_PROVENANCE=PASS sourceGitSha=$apk_sha versionCode=$apk_vc versionName=$apk_vn"

          echo "== Play AAB packaged web assets (provenance entries) =="
          unzip -l "$play_aab" | grep -F 'assets/public/build-provenance.json'
          aab_prov=$(unzip -p "$play_aab" base/assets/public/build-provenance.json)
          test -n "$aab_prov"
          aab_sha=$(printf '%s' "$aab_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceGitSha"])')
          aab_vc=$(printf '%s' "$aab_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')
          aab_vn=$(printf '%s' "$aab_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionName"])')
          test "$aab_sha" = "$SOURCE_COMMIT_SHA"
          test "$aab_vc" = "$VERSION_CODE"
          test "$aab_vn" = "$VERSION_NAME"
          echo "PLAY_AAB_PROVENANCE=PASS sourceGitSha=$aab_sha versionCode=$aab_vc versionName=$aab_vn"

          # 2) independent version read from the Domestic APK binary itself (aapt2 badging)
          aapt2_bin=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          test -n "$aapt2_bin"
          badging=$("$aapt2_bin" dump badging "$domestic_apk")
          pkg_line=$(printf '%s\n' "$badging" | grep '^package:')
          apk_vc_bin=$(printf '%s' "$pkg_line" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")
          apk_vn_bin=$(printf '%s' "$pkg_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "APK badging: $pkg_line"
          test "$apk_vc_bin" = "$VERSION_CODE"
          test "$apk_vn_bin" = "$VERSION_NAME"
          echo "APK_INDEPENDENT_VERSION=PASS versionCode=$apk_vc_bin versionName=$apk_vn_bin"

          # 3) Play AAB second evidence: the AAB's own packaged manifest.
          # (AGP 8.13 emits no output-metadata.json for bundles; read the binary
          #  AndroidManifest.xml from inside the AAB via aapt2 + a wrapper zip)
          rm -rf "$RUNNER_TEMP/aab-version"
          mkdir -p "$RUNNER_TEMP/aab-version"
          unzip -p "$play_aab" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/aab-version/AndroidManifest.xml"
          python3 - "$RUNNER_TEMP/aab-version/AndroidManifest.xml" "$RUNNER_TEMP/aab-version/aab-manifest.zip" <<'PYEOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[2], 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(sys.argv[1], 'AndroidManifest.xml')
          PYEOF
          aab_tree=$("$aapt2_bin" dump xmltree --file AndroidManifest.xml "$RUNNER_TEMP/aab-version/aab-manifest.zip")
          aab_vc_bin=$(printf '%s\n' "$aab_tree" | sed -n 's/.*versionCode(0x0101021b)=\([0-9][0-9]*\).*/\1/p' | head -1)
          aab_vn_bin=$(printf '%s\n' "$aab_tree" | sed -n 's/.*versionName(0x0101021c)="\([^"]*\)".*/\1/p' | head -1)
          echo "AAB manifest: versionCode=$aab_vc_bin versionName=$aab_vn_bin"
          test "$aab_vc_bin" = "$VERSION_CODE"
          test "$aab_vn_bin" = "$VERSION_NAME"
          echo "AAB_INDEPENDENT_VERSION=PASS versionCode=$aab_vc_bin versionName=$aab_vn_bin"
      - name: Verify R8 and ProGuard mapping files
        working-directory: app/android
        shell: bash
        run: |
          set -e

          for channel in playRelease domesticRelease; do
            mapping_dir="app/build/outputs/mapping/${channel}"
            if [ ! -d "$mapping_dir" ]; then
              echo "::error::R8 mapping directory missing for $channel"
              exit 1
            fi
            echo "$channel mapping: $(find "$mapping_dir" -name 'mapping.txt' | head -1)"
            test -s "$mapping_dir/mapping.txt"
          done

          echo "R8 ran successfully for both channels."
      - name: Check Room schema drift
        working-directory: app/android
        shell: bash
        run: |
          set -e

          schema_dir="app/schemas"

          git diff --exit-code -- "$schema_dir"

          untracked="$(git ls-files --others --exclude-standard -- "$schema_dir")"
          if [ -n "$untracked" ]; then
            echo "::error::Uncommitted Room schema files detected:"
            echo "$untracked"
            exit 1
          fi

          test -f "$schema_dir/com.flowbreak.app.FlowDatabase/1.json"
          test -f "$schema_dir/com.flowbreak.app.FlowDatabase/2.json"
          test -f "$schema_dir/com.flowbreak.app.FlowDatabase/3.json"
      - name: Verify channel manifests
        working-directory: app/android
        shell: bash
        run: |
          set -e
          play_manifest=$(find app/build/intermediates -path "*merged_manifests*playDebug*" -name AndroidManifest.xml | head -1)
          domestic_manifest=$(find app/build/intermediates -path "*merged_manifests*domesticDebug*" -name AndroidManifest.xml | head -1)
          echo "Play manifest:     $play_manifest"
          echo "Domestic manifest: $domestic_manifest"
          test -n "$play_manifest"
          test -n "$domestic_manifest"
          test -f "$play_manifest"
          test -f "$domestic_manifest"

          for manifest in "$play_manifest" "$domestic_manifest"; do
            echo "Checking $manifest"
            grep -q 'com.flowbreak.app.FlowForegroundService' "$manifest"
            grep -q 'android:foregroundServiceType="specialUse"' "$manifest"
            grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$manifest"
            grep -q 'android.permission.FOREGROUND_SERVICE"' "$manifest"
            grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
          done

          ! grep -q 'FlowAccessibilityService' "$play_manifest"
          grep -q 'com.flowbreak.app.FlowAccessibilityService' "$domestic_manifest"

          echo "All manifest checks passed."
      - name: Stage provenance artifact files
        shell: bash
        run: |
          set -e
          prov_dir=android/app/build/outputs/provenance
          mkdir -p "$prov_dir"
          aab_file=android/app/build/outputs/bundle/playRelease/app-play-release.aab
          apk_file=android/app/build/outputs/apk/domestic/release/app-domestic-release-unsigned.apk
          test -f "$aab_file"
          test -f "$apk_file"
          cp "$aab_file" "$prov_dir/app-play-release.aab"
          cp "$apk_file" "$prov_dir/app-domestic-release-unsigned.apk"
          cp android/app/build/outputs/mapping/playRelease/mapping.txt "$prov_dir/mapping-playRelease.txt"
          cp android/app/build/outputs/mapping/domesticRelease/mapping.txt "$prov_dir/mapping-domesticRelease.txt"
          cp dist/build-provenance.json "$prov_dir/build-provenance.json"
          node scripts/generate-artifact-manifest.mjs \
            --out "$prov_dir" \
            --provenance "$prov_dir/build-provenance.json" \
            --binaries '[{"channel":"play","type":"aab","path":"android/app/build/outputs/provenance/app-play-release.aab","filename":"app-play-release.aab"},{"channel":"domestic","type":"apk","path":"android/app/build/outputs/provenance/app-domestic-release-unsigned.apk","filename":"app-domestic-release-unsigned.apk"}]' \
            --extra-sums '[{"channel":"play","type":"mapping","path":"android/app/build/outputs/provenance/mapping-playRelease.txt","filename":"mapping-playRelease.txt"},{"channel":"domestic","type":"mapping","path":"android/app/build/outputs/provenance/mapping-domesticRelease.txt","filename":"mapping-domesticRelease.txt"}]'
          echo "=== SHA256SUMS.txt ==="
          cat "$prov_dir/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flowbreak-unsigned-${{ env.SOURCE_COMMIT_SHA }}
          path: app/android/app/build/outputs/provenance/
          if-no-files-found: error
          # 90 days: release preparation / GATE C audit window — artifacts must stay
          # downloadable and re-verifiable while later gates are being worked on.
          retention-days: 90

  release:
    # tag push = production signed release; workflow_dispatch = signed dry-run (TEST NOT FOR DISTRIBUTION).
    # Both require provisioned per-channel signing secrets — they fail clearly when secrets are absent.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    # Production signing secrets live ONLY in this protected environment.
    # PR / master verify jobs never enter it and never see signing secrets.
    environment:
      name: production-signing
    defaults:
      run:
        working-directory: app
    env:
      SOURCE_COMMIT_SHA: ${{ github.sha }}
      PR_HEAD_SHA: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify source identity (pre-build)
        shell: bash
        run: |
          set -e
          actual_sha=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$actual_sha"
          echo "SOURCE_REF=$GITHUB_REF"
          echo "WORKFLOW_SHA=$GITHUB_SHA"
          test "$actual_sha" = "$SOURCE_COMMIT_SHA"
          dirty="$(git status --porcelain)"
          test -z "$dirty"
          echo "SOURCE_IDENTITY=PASS sourceGitSha=$actual_sha workflowSha=$GITHUB_SHA"
      - name: Verify release tag integrity (production tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -e
          test "$GITHUB_REF_TYPE" = "tag"
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          echo "TAG_ON_MASTER_LINE=PASS tag=$GITHUB_REF_NAME sha=$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: npm ci
      # Version policy: app/package.json "version" is the single Source of Truth.
      # release-version.mjs validates stable SemVer, computes versionCode
      # (MAJOR*1_000_000 + MINOR*1_000 + PATCH) and, for tag builds, verifies
      # tag == v<version>. Output feeds GITHUB_ENV — no run_number/ref_name guessing.
      - name: Determine release version
        shell: bash
        run: |
          set -e
          args=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          node scripts/release-version.mjs "${args[@]}" >> "$GITHUB_ENV"
          echo "VERSION_POLICY=PASS"
          grep -E '^(VERSION_NAME|VERSION_CODE)=' "$GITHUB_ENV"
      - run: npm run build
      - name: Generate build provenance
        run: node scripts/generate-build-provenance.mjs dist
      - run: npx cap sync android
      - name: Verify web asset sync (dist -> Android assets)
        run: node scripts/verify-web-asset-sync.mjs dist android/app/src/main/assets/public
      - name: Check signing secrets presence
        shell: bash
        run: |
          set -e
          if [ -z "$FLOWBREAK_PLAY_KEYSTORE_BASE64" ] || [ -z "$FLOWBREAK_PLAY_KEYSTORE_PASSWORD" ] || [ -z "$FLOWBREAK_PLAY_KEY_ALIAS" ] || [ -z "$FLOWBREAK_PLAY_KEY_PASSWORD" ]; then
            echo "::error::Play signing secrets are not provisioned (FLOWBREAK_PLAY_*). Signed build cannot proceed."
            exit 1
          fi
          if [ -z "$FLOWBREAK_DOMESTIC_KEYSTORE_BASE64" ] || [ -z "$FLOWBREAK_DOMESTIC_KEYSTORE_PASSWORD" ] || [ -z "$FLOWBREAK_DOMESTIC_KEY_ALIAS" ] || [ -z "$FLOWBREAK_DOMESTIC_KEY_PASSWORD" ]; then
            echo "::error::Domestic signing secrets are not provisioned (FLOWBREAK_DOMESTIC_*). Signed build cannot proceed."
            exit 1
          fi
          echo "SIGNING_SECRETS=PRESENT"
        env:
          FLOWBREAK_PLAY_KEYSTORE_BASE64: ${{ secrets.FLOWBREAK_PLAY_KEYSTORE_BASE64 }}
          FLOWBREAK_PLAY_KEYSTORE_PASSWORD: ${{ secrets.FLOWBREAK_PLAY_KEYSTORE_PASSWORD }}
          FLOWBREAK_PLAY_KEY_ALIAS: ${{ secrets.FLOWBREAK_PLAY_KEY_ALIAS }}
          FLOWBREAK_PLAY_KEY_PASSWORD: ${{ secrets.FLOWBREAK_PLAY_KEY_PASSWORD }}
          FLOWBREAK_DOMESTIC_KEYSTORE_BASE64: ${{ secrets.FLOWBREAK_DOMESTIC_KEYSTORE_BASE64 }}
          FLOWBREAK_DOMESTIC_KEYSTORE_PASSWORD: ${{ secrets.FLOWBREAK_DOMESTIC_KEYSTORE_PASSWORD }}
          FLOWBREAK_DOMESTIC_KEY_ALIAS: ${{ secrets.FLOWBREAK_DOMESTIC_KEY_ALIAS }}
          FLOWBREAK_DOMESTIC_KEY_PASSWORD: ${{ secrets.FLOWBREAK_DOMESTIC_KEY_PASSWORD }}
      - name: Decode signing keys (RUNNER_TEMP only, never logged)
        shell: bash
        run: |
          set -e
          echo "$FLOWBREAK_PLAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flowbreak-play.jks"
          echo "$FLOWBREAK_DOMESTIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flowbreak-domestic.jks"
          echo "keystores decoded to RUNNER_TEMP"
        env:
          FLOWBREAK_PLAY_KEYSTORE_BASE64: ${{ secrets.FLOWBREAK_PLAY_KEYSTORE_BASE64 }}
          FLOWBREAK_DOMESTIC_KEYSTORE_BASE64: ${{ secrets.FLOWBREAK_DOMESTIC_KEYSTORE_BASE64 }}
      - name: Build signed releases
        working-directory: app/android
        run: ./gradlew bundlePlayRelease assembleDomesticRelease --stacktrace
        env:
          FLOWBREAK_PLAY_KEYSTORE_FILE: ${{ runner.temp }}/flowbreak-play.jks
          FLOWBREAK_PLAY_KEYSTORE_PASSWORD: ${{ secrets.FLOWBREAK_PLAY_KEYSTORE_PASSWORD }}
          FLOWBREAK_PLAY_KEY_ALIAS: ${{ secrets.FLOWBREAK_PLAY_KEY_ALIAS }}
          FLOWBREAK_PLAY_KEY_PASSWORD: ${{ secrets.FLOWBREAK_PLAY_KEY_PASSWORD }}
          FLOWBREAK_DOMESTIC_KEYSTORE_FILE: ${{ runner.temp }}/flowbreak-domestic.jks
          FLOWBREAK_DOMESTIC_KEYSTORE_PASSWORD: ${{ secrets.FLOWBREAK_DOMESTIC_KEYSTORE_PASSWORD }}
          FLOWBREAK_DOMESTIC_KEY_ALIAS: ${{ secrets.FLOWBREAK_DOMESTIC_KEY_ALIAS }}
          FLOWBREAK_DOMESTIC_KEY_PASSWORD: ${{ secrets.FLOWBREAK_DOMESTIC_KEY_PASSWORD }}
      - name: Verify packaged provenance (APK/AAB)
        working-directory: app/android
        shell: bash
        run: |
          set -e

          play_aab=$(find app/build/outputs/bundle/playRelease -maxdepth 1 -name '*.aab')
          domestic_apk=$(find app/build/outputs/apk/domestic/release -maxdepth 1 -name '*.apk')

          echo "== Domestic APK packaged web assets (provenance entries) =="
          unzip -l "$domestic_apk" | grep -F 'assets/public/build-provenance.json'
          apk_prov=$(unzip -p "$domestic_apk" assets/public/build-provenance.json)
          test -n "$apk_prov"
          apk_sha=$(printf '%s' "$apk_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceGitSha"])')
          apk_vc=$(printf '%s' "$apk_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')
          apk_vn=$(printf '%s' "$apk_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionName"])')
          test "$apk_sha" = "$SOURCE_COMMIT_SHA"
          test "$apk_vc" = "$VERSION_CODE"
          test "$apk_vn" = "$VERSION_NAME"
          echo "DOMESTIC_APK_PROVENANCE=PASS sourceGitSha=$apk_sha versionCode=$apk_vc versionName=$apk_vn"

          echo "== Play AAB packaged web assets (provenance entries) =="
          unzip -l "$play_aab" | grep -F 'assets/public/build-provenance.json'
          aab_prov=$(unzip -p "$play_aab" base/assets/public/build-provenance.json)
          test -n "$aab_prov"
          aab_sha=$(printf '%s' "$aab_prov" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceGitSha"])')
          test "$aab_sha" = "$SOURCE_COMMIT_SHA"
          echo "PLAY_AAB_PROVENANCE=PASS sourceGitSha=$aab_sha"

          # independent version read from the Domestic APK binary itself (aapt2 badging)
          aapt2_bin=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          test -n "$aapt2_bin"
          badging=$("$aapt2_bin" dump badging "$domestic_apk")
          pkg_line=$(printf '%s\n' "$badging" | grep '^package:')
          apk_vc_bin=$(printf '%s' "$pkg_line" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")
          apk_vn_bin=$(printf '%s' "$pkg_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "APK badging: $pkg_line"
          test "$apk_vc_bin" = "$VERSION_CODE"
          test "$apk_vn_bin" = "$VERSION_NAME"
          echo "APK_INDEPENDENT_VERSION=PASS versionCode=$apk_vc_bin versionName=$apk_vn_bin"
          # 3) Play AAB second evidence: the AAB's own packaged manifest.
          # (AGP 8.13 emits no output-metadata.json for bundles; read the binary
          #  AndroidManifest.xml from inside the AAB via aapt2 + a wrapper zip)
          rm -rf "$RUNNER_TEMP/aab-version"
          mkdir -p "$RUNNER_TEMP/aab-version"
          unzip -p "$play_aab" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/aab-version/AndroidManifest.xml"
          python3 - "$RUNNER_TEMP/aab-version/AndroidManifest.xml" "$RUNNER_TEMP/aab-version/aab-manifest.zip" <<'PYEOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[2], 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(sys.argv[1], 'AndroidManifest.xml')
          PYEOF
          aab_tree=$("$aapt2_bin" dump xmltree --file AndroidManifest.xml "$RUNNER_TEMP/aab-version/aab-manifest.zip")
          aab_vc_bin=$(printf '%s\n' "$aab_tree" | sed -n 's/.*versionCode(0x0101021b)=\([0-9][0-9]*\).*/\1/p' | head -1)
          aab_vn_bin=$(printf '%s\n' "$aab_tree" | sed -n 's/.*versionName(0x0101021c)="\([^"]*\)".*/\1/p' | head -1)
          echo "AAB manifest: versionCode=$aab_vc_bin versionName=$aab_vn_bin"
          test "$aab_vc_bin" = "$VERSION_CODE"
          test "$aab_vn_bin" = "$VERSION_NAME"
          echo "AAB_INDEPENDENT_VERSION=PASS versionCode=$aab_vc_bin versionName=$aab_vn_bin"
      - name: Verify signatures (apksigner / jarsigner + fingerprint allowlist)
        working-directory: app/android
        shell: bash
        run: |
          set -e
          play_aab=$(find app/build/outputs/bundle/playRelease -maxdepth 1 -name '*.aab' | head -1)
          domestic_apk=$(find app/build/outputs/apk/domestic/release -maxdepth 1 -name '*.apk' | head -1)
          aapt2_bin=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          apksigner_bin="$(dirname "$aapt2_bin")/apksigner"
          policy=../release-signing-policy.json

          echo "== Domestic APK: apksigner verify =="
          "$apksigner_bin" verify --verbose --print-certs "$domestic_apk"
          apk_cert=$("$apksigner_bin" verify --print-certs "$domestic_apk" | grep -E 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          test -n "$apk_cert"
          echo "DOMESTIC_CERT_SHA256=$apk_cert"
          echo "DOMESTIC_CERT_SHA256=$apk_cert" >> "$GITHUB_ENV"
          expected_domestic=$(python3 -c "import json;print(json.load(open('$policy', encoding='utf-8'))['domestic']['certificateSha256'])")
          if [ -n "$expected_domestic" ]; then
            test "$apk_cert" = "$expected_domestic"
            echo "DOMESTIC_FINGERPRINT_ALLOWLIST=PASS"
          else
            echo "::warning::release-signing-policy.json has no domestic fingerprint — allowlist NOT enforced"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::production tag release requires a provisioned domestic fingerprint allowlist"
              exit 1
            fi
          fi
          echo "DOMESTIC_SIGNATURE=PASS"

          echo "== Play AAB: jarsigner verify (self-signed upload keys are normal for Play) =="
          jarsigner -verify "$play_aab"
          aab_cert=$(keytool -printcert -jarfile "$play_aab" 2>/dev/null | grep -E 'SHA256:' | head -1 | sed -E 's/.*SHA256: *//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$aab_cert"
          echo "PLAY_CERT_SHA256=$aab_cert"
          echo "PLAY_CERT_SHA256=$aab_cert" >> "$GITHUB_ENV"
          expected_play=$(python3 -c "import json;print(json.load(open('$policy', encoding='utf-8'))['play']['certificateSha256'])")
          if [ -n "$expected_play" ]; then
            test "$aab_cert" = "$expected_play"
            echo "PLAY_FINGERPRINT_ALLOWLIST=PASS"
          else
            echo "::warning::release-signing-policy.json has no play fingerprint — allowlist NOT enforced"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::production tag release requires a provisioned play fingerprint allowlist"
              exit 1
            fi
          fi
          echo "PLAY_AAB_SIGNATURE=PASS"
      - name: Stage provenance artifact files
        shell: bash
        run: |
          set -e
          prov_dir=android/app/build/outputs/provenance
          mkdir -p "$prov_dir"
          aab_file=$(find android/app/build/outputs/bundle/playRelease -maxdepth 1 -name '*.aab' | head -1)
          apk_file=$(find android/app/build/outputs/apk/domestic/release -maxdepth 1 -name '*.apk' | head -1)
          aab_name=$(basename "$aab_file")
          apk_name=$(basename "$apk_file")
          cp "$aab_file" "$prov_dir/$aab_name"
          cp "$apk_file" "$prov_dir/$apk_name"
          cp android/app/build/outputs/mapping/playRelease/mapping.txt "$prov_dir/mapping-playRelease.txt"
          cp android/app/build/outputs/mapping/domesticRelease/mapping.txt "$prov_dir/mapping-domesticRelease.txt"
          cp dist/build-provenance.json "$prov_dir/build-provenance.json"
          signing_evidence=$(python3 - "$aab_name" "$apk_name" <<'PYEOF'
          import json, os, sys
          aab_name, apk_name = sys.argv[1], sys.argv[2]
          evidence = [
              {"filename": aab_name, "role": "upload-key", "certificateSha256": os.environ.get("PLAY_CERT_SHA256", "")},
              {"filename": apk_name, "role": "app-signing-key", "certificateSha256": os.environ.get("DOMESTIC_CERT_SHA256", "")},
          ]
          print(json.dumps(evidence))
          PYEOF
          )
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            artifact_name="flowbreak-signed-v${VERSION_NAME}-${SOURCE_COMMIT_SHA}"
          else
            artifact_name="flowbreak-signed-dry-run-v${VERSION_NAME}-${SOURCE_COMMIT_SHA}"
          fi
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "SIGNED_ARTIFACT_NAME=$artifact_name"
          node scripts/generate-artifact-manifest.mjs \
            --out "$prov_dir" \
            --provenance "$prov_dir/build-provenance.json" \
            --binaries "[{\"channel\":\"play\",\"type\":\"aab\",\"path\":\"$prov_dir/$aab_name\",\"filename\":\"$aab_name\"},{\"channel\":\"domestic\",\"type\":\"apk\",\"path\":\"$prov_dir/$apk_name\",\"filename\":\"$apk_name\"}]" \
            --extra-sums "[{\"channel\":\"play\",\"type\":\"mapping\",\"path\":\"$prov_dir/mapping-playRelease.txt\",\"filename\":\"mapping-playRelease.txt\"},{\"channel\":\"domestic\",\"type\":\"mapping\",\"path\":\"$prov_dir/mapping-domesticRelease.txt\",\"filename\":\"mapping-domesticRelease.txt\"}]" \
            --signing-evidence "$signing_evidence"
          echo "=== SHA256SUMS.txt ==="
          cat "$prov_dir/SHA256SUMS.txt"
      - name: Cleanup decoded keystores
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/flowbreak-play.jks" "$RUNNER_TEMP/flowbreak-domestic.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # tag push -> flowbreak-signed-v<version>-<sha>; dry-run -> flowbreak-signed-dry-run-v<version>-<sha>
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            app/android/app/build/outputs/bundle/playRelease/*.aab
            app/android/app/build/outputs/apk/domestic/release/*.apk
            app/android/app/build/outputs/provenance/
          if-no-files-found: error
          retention-days: 90
