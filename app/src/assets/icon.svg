<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="40" y="40" width="432" height="432" rx="112" ry="112" fill="url(#bg)"/>

  <!--
    核心图形：实心白色水滴/叶片
    底部饱满圆润，顶部尖锐分叉
    象征"流动被温柔打断"
  -->
  <path d="
    M 256 420
    C 190 420, 130 370, 130 290
    C 130 240, 160 200, 180 160
    L 256 60
    L 332 160
    C 352 200, 382 240, 382 290
    C 382 370, 322 420, 256 420
    Z" fill="#FFFFFF"/>

  <!-- 顶部分叉处的"断点" — 负空间切割 -->
  <path d="
    M 245 100
    L 228 168
    L 284 168
    L 267 100
    Z" fill="url(#bg)"/>

  <!-- 小叶片从断点向上生长 -->
  <path d="
    M 250 115
    Q 245 75, 260 55
    Q 275 75, 270 115
    Z" fill="#FFFFFF"/>
</svg>
